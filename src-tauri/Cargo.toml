[package]
name = "rterm_tauri"
version = "0.1.0"
edition = "2024"
description = "Tauri shell for the rTerm desktop workbench"
authors = ["r"]
license = "MIT"
build = "build.rs"

[lib]
name = "rterm_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
dirs = "6.0.0"
portable-pty = "0.9.0"
rterm = { path = ".." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
